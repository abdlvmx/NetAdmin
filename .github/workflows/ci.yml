name: ci

# Проверки на каждое изменение.
#
# До этого тесты гонялись только при выпуске релиза — то есть узнать о поломке
# можно было в момент, когда исправлять уже поздно. При этом половина проверок
# в проекте сторожит ровно то, что ломается молча: что значок попал в .exe, что
# релиз проставляет номер версии, что щит значка не разошёлся со спрайтом
# интерфейса, что встроенный агент собран из той же ревизии, что сервер.
#
# push ограничен main: ветку разработчика проверит pull_request, и запускать обе
# проверки на одно и то же значило бы платить дважды за один ответ.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Новый коммит в ветку отменяет проверку предыдущего: ответ по устаревшему коду
# всё равно никому не нужен.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows намеренно, как и в релизе: половина кода агента лежит в файлах
    # _windows.go, и на Linux их тесты просто не запускаются — проверка шла бы
    # мимо всего, что работает у пользователя.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Тесты
        run: go test ./...

      # gofmt здесь нет намеренно. В рабочих копиях под Windows файлы лежат с
      # CRLF (core.autocrlf), gofmt считает это расхождением с форматом и
      # помечает почти весь репозиторий. Проверка была бы красной всегда и
      # поэтому не значила бы ничего.

      - name: Сборка под Linux
        # Половина файлов проекта — с суффиксом _other: они существуют только
        # ради сборок вне Windows, и сломать их можно, ни разу не заметив.
        # Тесты там не гоняем — гоняется то, что действительно проверяемо.
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build ./...
