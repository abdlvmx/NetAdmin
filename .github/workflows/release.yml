name: release

# Готовые .exe для тех, у кого не установлен Go. Собирается по тегу вида v1.0.0:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # нужно для создания релиза

jobs:
  release:
    # Сборка идёт на Windows намеренно, хотя кросс-компиляция из Linux дешевле:
    # половина кода агента лежит в файлах _windows.go, и на Linux их тесты
    # просто не запускаются — релиз уходил бы непроверенным там, где работает.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Проверки
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -tags securityevents ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -tags securityevents ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Сборка
        # Helper собирает обе редакции строго последовательно: agent -> embed
        # -> server. Общий internal/agentbin/bin/agent.exe исключает matrix.
        # Версия из тега передаётся обоим бинарникам через linker -X в helper.
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ver = $env:RELEASE_TAG -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Некорректная версия релиза: $env:RELEASE_TAG"
          }
          ./scripts/build-windows.ps1 -Version $ver -Edition all

      - name: Комплект Windows и проверка архива
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ver = $env:RELEASE_TAG -replace '^v', ''
          ./scripts/package-windows.ps1 -Version $ver -Edition standard -DistDir dist/standard
          ./scripts/package-windows.ps1 -Version $ver -Edition events -DistDir dist/events
          $archivePaths = @('dist/standard/NetAdmin-Windows-x64.zip', 'dist/events/NetAdmin-Events-Windows-x64.zip')
          $checksumLines = foreach ($archivePath in $archivePaths) {
            $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($archivePath))"
          }
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'dist/SHA256SUMS.txt'), [string[]] $checksumLines, [System.Text.Encoding]::ASCII)

      - name: Описание релиза
        shell: pwsh
        run: |
          @'
          ## Как запустить

          1. Скачайте **NetAdmin-Windows-x64.zip** для обычной редакции либо
             **NetAdmin-Events-Windows-x64.zip** для редакции Events.
          2. Нажмите на ZIP правой кнопкой и выберите **«Извлечь всё»**.
          3. Откройте **netadmin.exe** двойным щелчком. Мастер поможет посмотреть
             демо, настроить сервер или подключить компьютер к готовому серверу.

          Ничего доустанавливать не нужно. Инструкция **START-HERE.txt** находится
          внутри комплекта. Для демо используйте `admin` / `Parol12345`;
          сеть в этом режиме не сканируется, данные временные.

          Для остальных компьютеров скачайте готовый агент в «Настройках» панели:
          адрес и код подключения уже будут заполнены. EXE нужной редакции
          находятся внутри выбранного ZIP.

          В Events сбор Windows выключен по умолчанию. Перед включением для
          выбранных ПК настройте HTTPS. Сервер и агент должны быть одной редакции.
          Для смены редакции агента нужна переустановка; самообновление сохраняет
          редакцию. Ограничения описаны в [документации Events](https://github.com/abdlvmx/NetAdmin/blob/main/docs/events.md).

          Контрольные суммы ZIP — в отдельном `SHA256SUMS.txt`, EXE — внутри ZIP.
          Данные установленного сервера сохраняются при обновлении.
          '@ | Out-File -FilePath notes.md -Encoding utf8

      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG dist/standard/NetAdmin-Windows-x64.zip dist/events/NetAdmin-Events-Windows-x64.zip dist/SHA256SUMS.txt --title "NetAdmin $env:RELEASE_TAG" --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
