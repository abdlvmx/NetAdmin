name: release

# Готовые .exe для тех, у кого не установлен Go. Собирается по тегу вида v1.0.0:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # нужно для создания релиза

jobs:
  release:
    # Сборка идёт на Windows намеренно, хотя кросс-компиляция из Linux дешевле:
    # половина кода агента лежит в файлах _windows.go, и на Linux их тесты
    # просто не запускаются — релиз уходил бы непроверенным там, где работает.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Проверки
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Сборка
        # Порядок важен: агент собирается первым и кладётся в
        # internal/agentbin/bin, откуда сервер встраивает его через go:embed.
        # Тогда установка агента не требует ничего загружать на сервер.
        #
        # -trimpath убирает пути сборочной машины из бинарника,
        # -s -w выкидывают отладочную информацию (примерно -30% размера),
        # -X проставляет номер версии из тега: без него оба файла ушли бы с
        # значением по умолчанию из internal/version, и релиз v1.2.0 называл бы
        # себя предыдущей версией. Имя символа сверяет TestReleaseStampsVersion.
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ver = $env:RELEASE_TAG -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Некорректная версия релиза: $env:RELEASE_TAG"
          }
          $ld = "-s -w -X netadmin/internal/version.Value=$ver"
          go build -trimpath -ldflags $ld -o internal/agentbin/bin/agent.exe ./cmd/agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags $ld -o dist/netadmin.exe ./cmd/netadmin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item internal/agentbin/bin/agent.exe dist/agent.exe

      - name: Комплект Windows и проверка архива
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/package-windows.ps1 -Version ($env:RELEASE_TAG -replace '^v', '')

      - name: Описание релиза
        shell: pwsh
        run: |
          @'
          ## Как запустить

          1. Скачайте **NetAdmin-Windows-x64.zip** из списка ниже.
          2. Нажмите на ZIP правой кнопкой и выберите **«Извлечь всё»**.
          3. Откройте **netadmin.exe** двойным щелчком. Мастер поможет посмотреть
             демо, настроить сервер или подключить компьютер к готовому серверу.

          Ничего доустанавливать не нужно. Инструкция **START-HERE.txt** находится
          внутри комплекта. Для демо используйте `admin` / `Parol12345`;
          сеть в этом режиме не сканируется, данные временные.

          Для остальных компьютеров скачайте готовый агент в «Настройках» панели:
          адрес и код подключения уже будут заполнены. Отдельные EXE оставлены
          ниже для обновлений и автоматической установки.

          Контрольные суммы ZIP и EXE — в отдельном `SHA256SUMS.txt`.
          Данные установленного сервера сохраняются при обновлении.
          '@ | Out-File -FilePath notes.md -Encoding utf8

      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG dist/NetAdmin-Windows-x64.zip dist/netadmin.exe dist/agent.exe dist/SHA256SUMS.txt --title "NetAdmin $env:RELEASE_TAG" --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
