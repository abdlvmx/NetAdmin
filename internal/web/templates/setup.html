<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAdmin — первый запуск</title>
  <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light;
      --bg: #f5f6fb; --surface: #ffffff; --border: #e7e9f1; --border-2: #d8dce8;
      --accent: #4f46e5; --accent-hov: #4338ca; --text: #181d2a; --muted: #6a7387; --red: #e2474d;
      --ring: 0 0 0 3px rgba(79,70,229,.16);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a0e18; --surface: #131a27; --border: #222b3c; --border-2: #303b52;
      --accent: #7c83ff; --accent-hov: #9499ff; --text: #e9eef7; --muted: #8f9aaf; --red: #f0686d;
      --ring: 0 0 0 3px rgba(124,131,255,.3);
    }
    body { background:
        radial-gradient(1100px 520px at 50% -8%, rgba(79,70,229,.14), transparent 70%),
        var(--bg);
      color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .wrap { width: 440px; max-width: 100%; }
    .logo { text-align: center; margin-bottom: 26px; }
    .logo .mark { width: 58px; height: 58px; border-radius: 17px; margin: 0 auto 14px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6); display: flex; align-items: center;
      justify-content: center; font-size: 26px; font-weight: 800; color: #fff;
      box-shadow: 0 10px 26px rgba(79,70,229,.4); }
    .logo h1 { font-size: 23px; font-weight: 800; letter-spacing: -0.4px; }
    .logo p { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 30px;
      box-shadow: 0 20px 50px rgba(18,24,46,.12); }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; background: var(--surface); border: 1px solid var(--border-2);
      border-radius: 11px; padding: 11px 13px; color: var(--text); font-size: 14px; outline: none;
      font-family: inherit; transition: border-color .14s, box-shadow .14s; }
    input::placeholder { color: var(--muted); opacity: .7; }
    input:focus { border-color: var(--accent); box-shadow: var(--ring); }
    .btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none;
      border-radius: 11px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px;
      box-shadow: 0 4px 14px rgba(79,70,229,.32); transition: background .14s, transform .1s; }
    .btn:hover { background: var(--accent-hov); }
    .btn:active { transform: translateY(1px); }
    .error { background: rgba(226,71,77,.12); border: 1px solid rgba(226,71,77,.28);
      color: var(--red); border-radius: 11px; padding: 11px 14px; font-size: 13px; margin-bottom: 16px; }
    .hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px; line-height: 1.5; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="mark">🛡</div>
    <h1>NetAdmin</h1>
    <p>Первичная настройка локальной панели для организации без домена</p>
  </div>
  <div class="card">
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <form method="post" action="/setup">
      <div class="form-group">
        <label>Название организации</label>
        <input type="text" name="organization_name" value="{{.OrganizationName}}" placeholder="ООО Ромашка">
      </div>
      <div class="form-group">
        <label>Логин администратора</label>
        <input type="text" name="username" placeholder="admin" autofocus required minlength="3">
      </div>
      <div class="form-group">
        <label>Имя администратора</label>
        <input type="text" name="full_name" placeholder="Иван Иванов">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" placeholder="минимум 8 символов" required minlength="8">
      </div>
      <button class="btn" type="submit">Создать администратора</button>
    </form>
  </div>
  <p class="hint">После настройки стандартный пароль не используется. Данные хранятся локально в папке приложения.</p>
</div>
</body>
</html>
