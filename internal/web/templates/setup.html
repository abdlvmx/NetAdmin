<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAdmin — первый запуск</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <script src="/static/theme.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light;
      --bg: #f7f7f8; --surface: #ffffff; --border: #e3e5e8; --border-2: #cfd3d8;
      --accent: #2f4a7a; --accent-hov: #24395e; --text: #1a1d21; --muted: #6b7280; --red: #a72834;
      --ring: 0 0 0 3px rgba(47,74,122,.18);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #101215; --surface: #17191d; --border: #282c32; --border-2: #3a3f47;
      --accent: #8fa9d4; --accent-hov: #a8bde0; --text: #e6e8ea; --muted: #8b919a; --red: #d97a80;
      --ring: 0 0 0 3px rgba(143,169,212,.28);
    }
    /* Фон без цветного свечения, плоская плашка логотипа, малые радиусы —
       те же принципы, что и в основном шаблоне. Палитра здесь своя копия:
       страницы входа и первой настройки не наследуют layout.html. */
    body { background: var(--bg);
      color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .wrap { width: 380px; }
    .logo { text-align: center; margin-bottom: 26px; }
    .logo .mark { width: 44px; height: 44px; border-radius: 6px; margin: 0 auto 12px;
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      display: flex; align-items: center; justify-content: center; }
    .logo .ico { width: 22px; height: 22px; }
    .logo h1 { font-size: 21px; font-weight: 600; letter-spacing: 0; }
    .logo p { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 26px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; margin-bottom: 5px; }
    input { width: 100%; background: var(--surface); border: 1px solid var(--border-2);
      border-radius: 5px; padding: 10px 12px; color: var(--text); font-size: 13.5px; outline: none;
      font-family: inherit; transition: border-color .14s, box-shadow .14s; }
    input::placeholder { color: var(--muted); opacity: .7; }
    input:focus { border-color: var(--accent); box-shadow: var(--ring); }
    .btn { width: 100%; padding: 11px; background: var(--accent); color: #fff; border: none;
      border-radius: 5px; font-size: 13.5px; font-weight: 600; cursor: pointer; margin-top: 8px;
      transition: background .14s; }
    .btn:hover { background: var(--accent-hov); }
    .error { background: var(--surface); border: 1px solid var(--red);
      color: var(--red); border-radius: 5px; padding: 10px 13px; font-size: 13px; margin-bottom: 15px; }
    .hint { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 20px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="mark"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8.5-8 9.5-4.5-1-8-4.5-8-9.5V6z"/></svg></div>
    <h1>NetAdmin</h1>
    <p>Первичная настройка локальной панели для организации без домена</p>
  </div>
  <div class="card">
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <form method="post" action="/setup">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <div class="form-group">
        <label>Название организации</label>
        <input type="text" name="organization_name" value="{{.OrganizationName}}" placeholder="ООО Ромашка">
      </div>
      <div class="form-group">
        <label>Логин администратора</label>
        <input type="text" name="username" placeholder="admin" autofocus required minlength="3">
      </div>
      <div class="form-group">
        <label>Имя администратора</label>
        <input type="text" name="full_name" placeholder="Иван Иванов">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" placeholder="минимум 8 символов" required minlength="8">
      </div>
      <button class="btn" type="submit">Создать администратора</button>
    </form>
  </div>
  <p class="hint">После настройки стандартный пароль не используется. Данные хранятся локально в папке приложения.</p>
</div>
</body>
</html>
