<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.OrgName}} — Заявка в ИТ-службу</title>
  <script src="/static/theme.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light;
      --bg: #f5f6fb; --surface: #ffffff; --border: #e7e9f1; --border-2: #d8dce8;
      --accent: #4f46e5; --accent-hov: #4338ca; --text: #181d2a; --muted: #6a7387;
      --red: #e2474d; --green: #18a558; --ring: 0 0 0 3px rgba(79,70,229,.16);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a0e18; --surface: #131a27; --border: #222b3c; --border-2: #303b52;
      --accent: #7c83ff; --accent-hov: #9499ff; --text: #e9eef7; --muted: #8f9aaf;
      --red: #f0686d; --green: #3ec07f; --ring: 0 0 0 3px rgba(124,131,255,.3);
    }
    body { background: radial-gradient(1100px 520px at 50% -8%, rgba(79,70,229,.14), transparent 70%), var(--bg);
      color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 36px 20px; }
    .wrap { width: 600px; max-width: 100%; }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo .mark { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 12px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6); display: flex; align-items: center;
      justify-content: center; font-size: 28px; box-shadow: 0 10px 26px rgba(79,70,229,.4); }
    .logo h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
    .logo p { font-size: 13px; color: var(--muted); margin-top: 5px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px;
      box-shadow: 0 20px 50px rgba(18,24,46,.12); }
    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    .row > .form-group { flex: 1 1 220px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
    label .req { color: var(--red); }
    input, select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--border-2);
      border-radius: 11px; padding: 11px 13px; color: var(--text); font-size: 14px; outline: none;
      font-family: inherit; transition: border-color .14s, box-shadow .14s; }
    textarea { min-height: 120px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: var(--ring); }
    .btn { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none;
      border-radius: 11px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px;
      box-shadow: 0 4px 14px rgba(79,70,229,.32); transition: background .14s, transform .1s; }
    .btn:hover { background: var(--accent-hov); }
    .btn:active { transform: translateY(1px); }
    .error { background: rgba(226,71,77,.12); border: 1px solid rgba(226,71,77,.28);
      color: var(--red); border-radius: 11px; padding: 11px 14px; font-size: 13px; margin-bottom: 16px; }
    .notice { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 28px; text-align: center; color: var(--muted); }
    .hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px; }
    .hint a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="mark"><svg class="ico"><use href="#i-ticket"/></svg></div>
    <h1>Заявка в ИТ-службу</h1>
    <p>{{.OrgName}}</p>
  </div>

  {{if not .Enabled}}
  <div class="notice">Приём заявок временно отключён. Обратитесь в ИТ-отдел напрямую.</div>
  {{else}}
  <div class="card">
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <form method="post" action="/help/submit">
      <input type="hidden" name="csrf_token" value="">
      <div class="form-group">
        <label>Выберите себя из списка <span style="font-weight:400">(или впишите ФИО ниже)</span></label>
        <select name="employee_id">
          <option value="">— меня нет в списке —</option>
          {{range .Employees}}<option value="{{.ID}}">{{.Name}}{{if .Dept}} · {{.Dept}}{{end}}</option>{{end}}
        </select>
      </div>
      <div class="form-group">
        <label>ФИО <span class="req">*</span></label>
        <input type="text" name="reporter_name" placeholder="Иванов Иван Иванович" value="{{index .Values "reporter_name"}}">
      </div>
      <div class="row">
        <div class="form-group">
          <label>Email <span style="font-weight:400">(для уведомлений о статусе)</span></label>
          <input type="email" name="reporter_email" placeholder="ivanov@org.ru" value="{{index .Values "reporter_email"}}">
        </div>
        <div class="form-group">
          <label>Телефон / внутренний</label>
          <input type="text" name="reporter_phone" placeholder="доб. 123" value="{{index .Values "reporter_phone"}}">
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Кабинет / расположение</label>
          <input type="text" name="location" placeholder="каб. 304, 3 этаж" value="{{index .Values "location"}}">
        </div>
        <div class="form-group">
          <label>Категория</label>
          <select name="category">
            <option value="">— не выбрано —</option>
            {{$c := index .Values "category"}}
            {{range .Categories}}<option value="{{.}}"{{if eq . $c}} selected{{end}}>{{.}}</option>{{end}}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Кратко о проблеме</label>
        <input type="text" name="title" placeholder="Не печатает принтер" value="{{index .Values "title"}}">
      </div>
      <div class="form-group">
        <label>Подробное описание <span class="req">*</span></label>
        <textarea name="description" placeholder="Опишите, что случилось, когда началось, какие сообщения об ошибке…">{{index .Values "description"}}</textarea>
      </div>
      <button class="btn" type="submit">Отправить заявку</button>
    </form>
  </div>
  {{end}}

  <p class="hint">Уже отправляли заявку? <a href="/help/track">Проверить статус по коду</a></p>
</div>

<script src="/static/help.js" defer></script>
</body>
</html>
